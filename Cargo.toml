[package]
name = "tune-native"
version = "0.0.0"
description = "Нативный клиент Яндекс Музыки на Rust"
edition = "2021"
publish = false

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
ctr = "0.10.1"
hmac = "0.13.0"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "smol", "image", "svg"] }
raw-window-handle = "0.6"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-aac", "symphonia-flac", "symphonia-isomp4"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
souvlaki = "0.8.3"
tao = "0.37"
ureq = "3.5.0"
wry = "0.57"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
