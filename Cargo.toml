[package]
name = "tune-native"
version = "0.1.0"
description = "Нативный клиент Яндекс Музыки на Rust"
edition = "2021"
publish = false

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
ctr = "0.10.1"
flate2 = "1.1.10"
hmac = "0.13.0"
# Та же версия, что внутри iced: обложки распаковываются в фоне, а не во время отрисовки кадра.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "smol", "image", "svg", "wgpu", "web-colors", "canvas", "advanced"] }
raw-window-handle = "0.6"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-aac", "symphonia-flac", "symphonia-isomp4"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.20.2", default-features = false }
sha2 = "0.11.1"
souvlaki = "0.8.3"
tao = "0.37"
ureq = "3.5.0"
windows-sys = { version = "0.60", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
wry = "0.57"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
